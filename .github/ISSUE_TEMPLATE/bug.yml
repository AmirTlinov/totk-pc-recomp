name: Bug report
description: Something breaks, crashes or looks wrong.
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or link game files, keys, firmware or builds. Issues that do are closed.
  - type: input
    id: version
    attributes:
      label: Version
      description: The title line of the settings menu (F1), for example "TotK Recomp 0.1.0, game 1.4.3".
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
      description: Copy system info in the menu's Advanced tab puts them on the clipboard.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach logs\totk.log from the folder of totk.exe. After a crash, copy it before you start the game again.
