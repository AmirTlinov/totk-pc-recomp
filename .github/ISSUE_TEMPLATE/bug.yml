name: Bug report
description: Something breaks, crashes or looks wrong.
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or link game files, keys, firmware or builds. Issues that do are closed.
  - type: input
    id: version
    attributes:
      label: Game version
      description: As shown in the window title, for example 1.2.1.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the log file from the run where it happened.
